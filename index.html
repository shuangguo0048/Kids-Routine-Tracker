<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Youan's Daily Routines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #F4F7F4;
      --card-bg: #FFFFFF;
      --primary: #5F8C5F;
      --primary-hover: #4E754E;
      --accent: #E6EFE6;
      --text-main: #2D3B2D;
      --text-muted: #7E937E;
      --shadow-sm: 0 4px 12px rgba(95, 140, 95, 0.08);
      --shadow-md: 0 8px 24px rgba(95, 140, 95, 0.12);
      --radius-lg: 24px;
      --radius-sm: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Nunito', 'Fredoka', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .profile-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-wrap {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid #FFF;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      overflow: hidden;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
    }

    .user-info p {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-pill {
      background: #FFF;
      padding: 8px 18px;
      border-radius: 30px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 900;
      color: var(--text-main);
    }

    .btn-icon {
      background: #FFF;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      box-shadow: var(--shadow-sm);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-icon:active {
      transform: scale(0.92);
    }

    .mode-bar {
      width: 100%;
      max-width: 900px;
      background: #EAF0EA;
      padding: 6px;
      border-radius: 40px;
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 30px;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-btn.active {
      background: #FFF;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .grid-container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
      margin-bottom: 30px;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, background-color 0.25s ease;
      min-height: 195px;
    }

    .card:active {
      transform: scale(0.96);
    }

    .bubble-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 105px;
      height: 105px;
      transform: translate(-50%, -60%);
